[project]
name = "motor-fluxos"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-ollama>=1.0",
  "langchain-core>=1.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
